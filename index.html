<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>iDirect Messenger (Pro)</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* =========================================
       PART 1: THEME & CSS STRUCTURE
       ========================================= */
    :root {
      --bg-base: #06070a; --app-bg: #0d0f15; --panel-bg: #0d0f15;
      --glass-card: rgba(255, 255, 255, 0.06); --glass-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff; --text-muted: rgba(255, 255, 255, 0.55);
      --input-bg: rgba(255, 255, 255, 0.08);
      --bubble-out: #007aff; --bubble-out-text: #ffffff;
      --bubble-in: rgba(255, 255, 255, 0.12); --bubble-in-border: rgba(255, 255, 255, 0.16); --bubble-in-text: #ffffff;
      --nav-bg: #11141c; --menu-bg: rgba(22, 24, 32, 0.96); --menu-hover: rgba(255, 255, 255, 0.08);
      --highlight: rgba(255, 215, 0, 0.3);
    }

    [data-theme="light"] {
      --bg-base: #e9eef5; --app-bg: #f4f6f9; --panel-bg: #ffffff;
      --glass-card: rgba(0, 0, 0, 0.04); --glass-border: rgba(0, 0, 0, 0.09);
      --text: #1a1a1e; --text-muted: rgba(0, 0, 0, 0.52);
      --input-bg: rgba(0, 0, 0, 0.05);
      --bubble-out: #007aff; --bubble-out-text: #ffffff;
      --bubble-in: #e5e5ea; --bubble-in-border: #dcdce2; --bubble-in-text: #000000;
      --nav-bg: #f8f9fa; --menu-bg: rgba(255, 255, 255, 0.97); --menu-hover: rgba(0, 0, 0, 0.06);
      --highlight: rgba(255, 215, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-base); color: var(--text); transition: background-color 0.3s ease; }
    body { display: flex; justify-content: center; align-items: center; }

    .orb { position: fixed; border-radius: 50%; filter: blur(95px); z-index: 0; opacity: 0.45; pointer-events: none; animation: floatOrb 14s infinite alternate ease-in-out; }
    .orb-1 { width: 340px; height: 340px; background: radial-gradient(circle, #007aff, #5856d6); top: 5%; left: 5%; }
    .orb-2 { width: 380px; height: 380px; background: radial-gradient(circle, #00d2ff, #007aff); bottom: 5%; right: 5%; animation-delay: -6s; }
    @keyframes floatOrb { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-30px) scale(1.08); } }

    .app-layout { width: 100%; height: 100%; height: 100dvh; position: relative; z-index: 1; display: flex; background: var(--app-bg); overflow: hidden; }
    @media (min-width: 768px) { .app-layout { max-width: 1050px; height: 90vh; border-radius: 28px; border: 1px solid var(--glass-border); box-shadow: 0 25px 65px rgba(0, 0, 0, 0.45); } }

    .btn { background: var(--glass-card); color: var(--text); border: 1px solid var(--glass-border); padding: 12px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.15s; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #007aff; color: #fff; border: none; }
    .btn-secondary { background: var(--glass-card); border: 1px solid var(--glass-border); }

    input { background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 22px; padding: 12px 18px; color: var(--text); font-size: 0.95rem; outline: none; user-select: text; }

    /* AUTH OVERLAY */
    #authOverlay { position: absolute; inset: 0; z-index: 80; background: var(--bg-base); display: flex; justify-content: center; align-items: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 380px; padding: 30px 24px; background: var(--panel-bg); border-radius: 28px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 15px; }
    .auth-header h1 { font-size: 2.2rem; font-weight: 700; text-align: center; color: #007aff; }
    .auth-tabs { display: flex; background: var(--input-bg); padding: 4px; border-radius: 18px; }
    .auth-tab { flex: 1; text-align: center; padding: 8px 0; font-weight: 600; font-size: 0.88rem; color: var(--text-muted); cursor: pointer; border-radius: 14px; }
    .auth-tab.active { background: #007aff; color: #fff; }

    /* SIDEBAR & NAV */
    .sidebar { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--panel-bg); border-right: 1px solid var(--glass-border); flex-shrink: 0; z-index: 1; }
    @media (min-width: 768px) { .sidebar { width: 360px; } }
    .glass-nav { padding: max(14px, env(safe-area-inset-top)) 16px 14px 16px; background: var(--nav-bg); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; min-height: 64px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--glass-card); border: 1px solid var(--glass-border); color: var(--text); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
    .icon-btn:active { transform: scale(0.92); }
    
    /* SEARCH BAR UI */
    .search-container { padding: 10px 14px; border-bottom: 1px solid var(--glass-border); background: var(--nav-bg); }
    .search-input { width: 100%; padding: 8px 14px; border-radius: 16px; background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text); font-size: 0.9rem; }
    
    /* MENUS & LISTS */
    .main-dropdown-menu { position: absolute; top: max(60px, env(safe-area-inset-top) + 40px); right: 16px; background: var(--menu-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; width: 200px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; display: none; flex-direction: column; overflow: hidden; }
    .menu-item { padding: 12px 16px; font-size: 0.95rem; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.15s; }
    .menu-item:hover { background: var(--menu-hover); }
    .menu-item.danger { color: #ff3b30; border-top: 1px solid var(--glass-border); }
    .section-list { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--glass-card); border-radius: 20px; border: 1px solid var(--glass-border); cursor: pointer; }
    .list-item:hover { background: rgba(0, 122, 255, 0.08); }
    .avatar-wrapper { position: relative; margin-right: 12px; flex-shrink: 0; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #007aff, #5856d6); display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 1.1rem; color: #fff; overflow: hidden; background-size: cover; background-position: center; }
    .online-badge { width: 12px; height: 12px; background: #34c759; border-radius: 50%; border: 2px solid var(--panel-bg); position: absolute; bottom: 0; right: 0; display: none; }
    .online-badge.active { display: block; }
    .item-meta { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .item-meta .title { font-size: 0.98rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta .subtitle { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge { background: #34c759; color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 0.75rem; font-weight: 700; margin-left: 6px; display: none; }
    .unread-badge.active { display: inline-block; }

    /* CHAT PANEL */
    .chat-panel { flex: 1; height: 100%; display: flex; flex-direction: column; position: absolute; inset: 0; background: var(--panel-bg) !important; transform: translateX(100%); transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1); z-index: 20; }
    @media (min-width: 768px) { .chat-panel { position: relative; transform: translateX(0) !important; } }
    .chat-panel.active { transform: translateX(0); }
    .back-btn-mobile { display: flex; }
    @media (min-width: 768px) { .back-btn-mobile { display: none !important; } }
    .chat-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--panel-bg); }
    
    /* BUBBLES & FILES */
    .bubble-row { display: flex; flex-direction: column; position: relative; width: 100%; }
    .bubble-row.outgoing { align-items: flex-end; }
    .bubble-row.incoming { align-items: flex-start; }
    .bubble { max-width: 78%; padding: 10px 16px; font-size: 0.94rem; line-height: 1.42; word-break: break-word; border-radius: 22px; position: relative; user-select: text; cursor: pointer; }
    .bubble.outgoing { background: #007aff !important; color: #ffffff !important; border-radius: 22px 22px 5px 22px; }
    .bubble.incoming { background: var(--bubble-in); color: var(--bubble-in-text); border-radius: 22px 22px 22px 5px; border: 1px solid var(--bubble-in-border); }
    .bubble a { color: inherit; text-decoration: underline; font-weight: 500; }
    
    /* Document/Video Bubble Styles */
    .file-bubble { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.15); padding: 8px 12px; border-radius: 12px; margin-bottom: 4px; }
    .file-bubble .icon { font-size: 1.8rem; }
    .file-bubble .details { display: flex; flex-direction: column; }
    .file-bubble .details span { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}
    .file-bubble .details small { font-size: 0.7rem; opacity: 0.8; }

    .bubble-meta { font-size: 0.68rem; color: var(--text-muted); margin-top: 3px; display: flex; gap: 4px; align-items: center; }
    .status-tick { font-size: 0.72rem; font-weight: bold; }
    .status-tick.sent { color: var(--text-muted); }
    .status-tick.delivered { color: var(--text-muted); }
    .status-tick.seen { color: #007aff; }

    /* Input & Bottom Bar */
    .chat-input-bar { width: 100%; padding: 8px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 5px; background: var(--nav-bg); border-top: 1px solid var(--glass-border); flex-shrink: 0; box-sizing: border-box; }
    .chat-input-bar input { flex: 1 1 auto; min-width: 0; border-radius: 20px; padding: 9px 14px; font-size: 0.95rem; height: 38px; }
    .input-action-btn { width: 36px; height: 36px; min-width: 36px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass-card); display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--text); font-size: 1rem; position: relative;}
    .send-btn { background: #007aff; border: none; color: #fff; }
    
    /* Attachment Menu */
    .attach-menu { position: absolute; bottom: 50px; left: 10px; background: var(--menu-bg); padding: 10px; border-radius: 16px; border: 1px solid var(--glass-border); display: none; flex-direction: column; gap: 10px; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .attach-menu.active { display: flex; }
    .attach-item { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px; font-size: 0.9rem; color: var(--text); }
    .attach-item:hover { background: var(--menu-hover); border-radius: 10px; }

    /* Upload Progress Box */
    .upload-progress-bar { width: 100%; height: 3px; background: rgba(0,0,0,0.2); position: absolute; top: 0; left: 0; display: none; }
    .upload-progress-fill { height: 100%; background: #34c759; width: 0%; transition: width 0.2s; }

    /* Context Menus & Modals */
    .wa-context-menu { position: fixed; background: var(--menu-bg); border: 1px solid var(--glass-border); border-radius: 16px; width: 210px; box-shadow: 0 16px 40px rgba(0,0,0,0.55); z-index: 100; display: none; flex-direction: column; overflow: hidden; }
    .wa-react-bar { display: flex; justify-content: space-around; padding: 8px 10px; background: var(--glass-card); border-bottom: 1px solid var(--glass-border); }
    .wa-react-bar span { font-size: 1.35rem; cursor: pointer; }
    .wa-menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: 0.9rem; cursor: pointer; }
    .wa-menu-item:hover { background: var(--menu-hover); }
    .dialog-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(14px); display: none; justify-content: center; align-items: center; padding: 24px; z-index: 120; }
    .dialog-card { padding: 24px; width: 100%; max-width: 380px; background: var(--panel-bg); border-radius: 26px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>
<!-- =========================================
       PART 2: HTML UI STRUCTURE
       ========================================= -->

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- AUTH SCREEN -->
  <div id="authOverlay">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Direct</h1>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">Secure Messenger Pro</p>
      </div>
      <div class="auth-tabs">
        <div class="auth-tab active" id="loginTabBtn" onclick="toggleAuthTab('login')">Log In</div>
        <div class="auth-tab" id="signupTabBtn" onclick="toggleAuthTab('signup')">Sign Up</div>
      </div>
      <input type="text" id="usernameInput" placeholder="Your Name" style="display:none;" />
      <input type="text" id="usercodeInput" placeholder="Secret Code (e.g. 1024)" maxlength="8" />
      <input type="password" id="passwordInput" placeholder="Password" />
      <button class="btn btn-primary" id="authSubmitBtn" onclick="handleAuthSubmit()">Log In</button>
      <div id="authError" style="color:#ff3b30; font-size:0.82rem; text-align:center;"></div>
    </div>
  </div>

  <!-- MAIN APP LAYOUT -->
  <div class="app-layout">
    
    <!-- LEFT SIDEBAR (Chats List) -->
    <div class="sidebar">
      <div class="glass-nav">
        <h2 style="font-size: 1.4rem; font-weight: 700; margin-left: 4px;">Chats</h2>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="icon-btn" onclick="openAddFriendModal()">+</button>
          <button class="icon-btn" onclick="toggleMainMenu()" style="position:relative;">
            ⋮
            <div class="notification-dot" id="menuDot"></div>
          </button>
        </div>
      </div>

      <!-- Main Sidebar Search -->
      <div class="search-container">
        <input type="text" id="searchFriends" class="search-input" placeholder="Search chats or code..." onkeyup="filterFriendsList()" />
      </div>

      <!-- Main Sidebar Menu Dropdown -->
      <div class="main-dropdown-menu" id="mainMenu">
        <div class="menu-item" onclick="openProfileModal()">⚙️ Profile</div>
        <div class="menu-item" onclick="toggleTheme()">🌗 Toggle Theme</div>
        <div class="menu-item" onclick="openRequestsModal()">
          <span>🔔 Requests</span>
          <span class="unread-badge" id="requestsCount" style="margin:0;"></span>
        </div>
        <div class="menu-item danger" onclick="handleLogout()">🚪 Logout</div>
      </div>

      <div class="section-list" id="friendsList"></div>
    </div>

    <!-- RIGHT CHAT PANEL -->
    <div class="chat-panel" id="chatPanel">
      
      <!-- Upload Progress Bar (Shows during file upload) -->
      <div class="upload-progress-bar" id="uploadProgressContainer">
        <div class="upload-progress-fill" id="uploadProgressBar"></div>
      </div>

      <!-- Chat Header -->
      <div class="glass-nav" id="chatHeader" style="display: none;">
        <button class="icon-btn back-btn-mobile" style="width:34px; height:34px;" onclick="closeChatMobile()">&#10094;</button>
        <div class="chat-header-clickable" onclick="viewFriendProfile()" style="display:flex; align-items:center; gap:10px; flex:1; cursor:pointer;">
          <div class="avatar-wrapper">
            <div class="avatar" id="chatPartnerAvatar" style="width:36px; height:36px;">?</div>
            <div class="online-badge" id="chatPartnerOnlineDot"></div>
          </div>
          <div style="min-width:0;">
            <h3 id="chatPartnerName" style="font-size:0.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Friend</h3>
            <div style="font-size:0.75rem; color:var(--text-muted);" id="chatPartnerStatus">Offline</div>
          </div>
        </div>
      </div>

      <div class="empty-chat-placeholder" id="emptyPlaceholder">
        <span style="font-size: 2.5rem; opacity: 0.5;">💬</span>
        <span>Select a chat to start messaging</span>
      </div>

      <!-- Chat Body where bubbles appear -->
      <div class="chat-body" id="chatBody" style="display: none;"></div>

      <div class="typing-box" id="typingBox">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>

      <!-- Chat Input Area -->
      <form class="chat-input-bar" id="chatInputBar" style="display: none;" onsubmit="handleSendMessage(event)">
        
        <!-- Attachment Button -->
        <button type="button" class="input-action-btn" onclick="toggleAttachMenu()">📎</button>
        
        <!-- New File Attachment Menu -->
        <div class="attach-menu" id="attachMenu">
          <div class="attach-item" onclick="document.getElementById('imageFileInput').click()">🖼️ Photo/Video</div>
          <div class="attach-item" onclick="document.getElementById('docFileInput').click()">📄 Document (PDF/Zip)</div>
        </div>
        
        <!-- Hidden File Inputs -->
        <input type="file" id="imageFileInput" accept="image/*,video/*" style="display:none;" onchange="handleFileSelected(event, 'media')" />
        <input type="file" id="docFileInput" accept=".pdf,.zip,.doc,.docx,.txt" style="display:none;" onchange="handleFileSelected(event, 'document')" />
        
        <input type="text" id="chatMessageInput" placeholder="Type a message..." autocomplete="off" oninput="handleTypingEvent()" />
        <button type="submit" class="input-action-btn send-btn" id="sendBtn">&#10148;</button>
      </form>
    </div>

  </div>

  <!-- CONTEXT MENU (Message Long-Press) -->
  <div class="wa-context-menu" id="waContextMenu">
    <div class="wa-react-bar">
      <span onclick="reactToMessage('❤️')">❤️</span>
      <span onclick="reactToMessage('😂')">😂</span>
      <span onclick="reactToMessage('👍')">👍</span>
      <span onclick="reactToMessage('😮')">😮</span>
    </div>
    <div class="wa-menu-item" onclick="copyActiveMessage()">📋 Copy</div>
    <div class="wa-menu-item" id="menuDeleteOption" style="color:#ff3b30;" onclick="deleteActiveMessage()">🗑️ Delete for Everyone</div>
  </div>

  <!-- FRIEND PROFILE MODAL -->
  <div class="dialog-overlay" id="friendProfileModal" onclick="if(event.target===this) this.style.display='none'">
    <div class="dialog-card" style="align-items: center; text-align: center;">
      <img src="" id="fpImage" class="full-profile-img" style="display:none;" />
      <div id="fpInitials" class="avatar" style="width:150px; height:150px; font-size:4rem; margin:0 auto; display:flex;"></div>
      <h2 id="fpName" style="margin-top:10px; font-size:1.4rem;">Name</h2>
      <p id="fpCode" style="color:var(--text-muted); font-size:0.9rem;">Code: ---</p>
      <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="document.getElementById('friendProfileModal').style.display='none'">Close</button>
    </div>
  </div>

  <!-- SELF PROFILE MODAL -->
  <div class="dialog-overlay" id="profileModal">
    <div class="dialog-card">
      <h3 style="font-size: 1.1rem; text-align:center;">My Profile</h3>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div class="avatar" id="profileModalAvatar" style="width: 72px; height: 72px; font-size: 1.8rem; cursor: pointer;" onclick="document.getElementById('dpFileInput').click()">?</div>
        <input type="file" id="dpFileInput" accept="image/*" style="display: none;" onchange="handleDpUpload(event)" />
      </div>
      <label style="font-size: 0.8rem; color: var(--text-muted);">Display Name</label>
      <input type="text" id="editUsernameInput" placeholder="New Name" />
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="btn btn-primary" style="flex:1;" onclick="saveProfileChanges()">Save</button>
        <button class="btn btn-secondary" onclick="document.getElementById('profileModal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ADD FRIEND MODAL -->
  <div class="dialog-overlay" id="addFriendModal">
    <div class="dialog-card">
      <h3>Add Contact</h3>
      <input type="text" id="friendSearchCode" placeholder="Enter friend's code (e.g. 7482)" />
      <button class="btn btn-primary" onclick="searchFriendByCode()">Search</button>
      <div id="friendSearchResult"></div>
      <button class="btn btn-secondary" onclick="document.getElementById('addFriendModal').style.display='none'">Cancel</button>
    </div>
  </div>

  <!-- REQUESTS MODAL -->
  <div class="dialog-overlay" id="requestsModal">
    <div class="dialog-card">
      <h3>Pending Requests</h3>
      <div id="requestsContainer"></div>
      <button class="btn btn-secondary" onclick="document.getElementById('requestsModal').style.display='none'">Close</button>
    </div>
  </div>
<!-- =========================================
       PART 3: CONFIGURATION & SETUP SCRIPTS
       ========================================= -->
  <script>
    // Paste your Firebase Config keys here
    const firebaseConfig = {
      apiKey: "AIzaSyBPAPlMU4S-6yKhDYZyNMkABzF0jE16dTo",
      authDomain: "my-direct-85333.firebaseapp.com",
      databaseURL: "https://my-direct-85333-default-rtdb.firebaseio.com",
      projectId: "my-direct-85333",
      storageBucket: "my-direct-85333.firebasestorage.app",
      messagingSenderId: "831029091786",
      appId: "1:831029091786:web:9c75ae141ec1828165c333"
    };

    // Apne update kiye hue Apps Script ka URL yaha daalein (Jisme Google Drive file upload logic hai)
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwUNgUls29dL9yHK5mZGwA_lv88mRkIfZjKQvoMXN72mJCvMC53FV1E2cTnewm1F0Q/exec";
    
    // Auto-login session lock timer
    const SESSION_TIMEOUT_MS = 15 * 60 * 1000;

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null, activeFriend = null, authMode = 'login', activeChatListener = null;
    let selectedMsgId = null, selectedMsgText = "";
    let allFriendsData = []; // Naye Search feature ke liye 

    // File Attachment Menu Toggle
    function toggleAttachMenu() {
      const menu = document.getElementById('attachMenu');
      menu.classList.toggle('active');
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.attach-menu') && !e.target.closest('.input-action-btn')) {
        document.getElementById('attachMenu').classList.remove('active');
      }
    });

    // =========================================
    // SFX & HAPTICS (TICK/POP) 
    // =========================================
    function playAudioTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        
        if (type === 'send') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.start(); osc.stop(ctx.currentTime + 0.06);
        }
        if (navigator.vibrate) navigator.vibrate(type === 'send' ? 10 : 20);
      } catch (e) {}
    }

    // =========================================
    // GOOGLE DRIVE FILE UPLOAD LOGIC
    // =========================================
    function handleFileSelected(event, fileType) {
      document.getElementById('attachMenu').classList.remove('active');
      const file = event.target.files[0];
      if (!file || !activeFriend) return;
      
      const maxSizeMB = 50; // Google Drive upload limit per file in this setup
      if (file.size > maxSizeMB * 1024 * 1024) {
        alert(`File is too large! Maximum limit is ${maxSizeMB}MB`);
        return;
      }

      // Show Upload Progress UI
      const progressBar = document.getElementById('uploadProgressBar');
      const progressContainer = document.getElementById('uploadProgressContainer');
      const sendBtn = document.getElementById('sendBtn');
      
      progressContainer.style.display = 'block';
      progressBar.style.width = '10%';
      sendBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = async function(evt) {
        progressBar.style.width = '50%';
        
        // Base64 encoding for Apps Script
        const base64Data = evt.target.result.split(',')[1];
        
        try {
          progressBar.style.width = '80%';
          
          const response = await fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            body: new URLSearchParams({
              action: 'upload_file',
              fileName: file.name,
              mimeType: file.type,
              base64: base64Data
            })
          });
          
          const result = await response.json();
          progressBar.style.width = '100%';
          
          if (result.success) {
            // File successfully saved in Google Drive. Send link in Chat.
            const chatId = [String(currentUser.user_code), String(activeFriend.user_code)].sort().join('_');
            
            let messagePayload = {
              sender_code: currentUser.user_code,
              timestamp: new Date().getTime(),
              status: 'sent',
              file_name: file.name,
              file_url: result.fileUrl // Google Drive Shareable Link
            };

            if (fileType === 'media' && file.type.startsWith('image/')) {
               messagePayload.image = result.fileUrl; 
            } else {
               messagePayload.document = true;
            }

            playAudioTone('send');
            await db.ref('messages/' + chatId).push(messagePayload);
            
          } else {
            alert('Error uploading file to Drive.');
          }
          
        } catch(e) {
          alert('Upload failed due to connection error.');
        } finally {
          progressContainer.style.display = 'none';
          progressBar.style.width = '0%';
          sendBtn.disabled = false;
          event.target.value = '';
        }
      };
      
      reader.readAsDataURL(file);
    }
// =========================================
    // PART 4: CORE CHAT LOGIC & SEARCH
    // =========================================

    // Format Timestamp to Time
    function formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    // Advanced Search Filter (By Name or Code)
    function filterFriendsList() {
      const query = document.getElementById('searchFriends').value.toLowerCase().trim();
      const listContainer = document.getElementById('friendsList');
      
      if (!query) {
        // Agar search khali hai, toh original order dikhao
        renderFriendsUI(allFriendsData);
        return;
      }
      
      const filtered = allFriendsData.filter(f => 
        (f.username && f.username.toLowerCase().includes(query)) || 
        (f.user_code && String(f.user_code).includes(query))
      );
      
      renderFriendsUI(filtered);
    }

    function renderFriendsUI(friendsArray) {
      const listContainer = document.getElementById('friendsList');
      if (friendsArray.length === 0) {
        listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 50px;">No matching chats found.</div>`;
        return;
      }

      listContainer.innerHTML = '';
      friendsArray.forEach(info => {
        const code = info.user_code;
        const item = document.createElement('div');
        item.className = 'list-item' + (activeFriend && activeFriend.user_code === code ? ' selected' : '');
        item.onclick = () => openChat({ user_code: code, username: info.username, photoUrl: info.photoUrl });

        item.innerHTML = `
          <div style="display: flex; align-items: center; min-width: 0;">
            <div class="avatar-wrapper">
              <div class="avatar" id="avatar_${code}"></div>
              <div class="online-badge" id="badge_${code}"></div>
            </div>
            <div class="item-meta">
              <span class="title">${String(info.username).replace(/</g, "&lt;")}</span>
              <span class="subtitle">Code: ${code}</span>
            </div>
          </div>
          <div style="display: flex; align-items: center; flex-shrink: 0;">
            <span class="unread-badge" id="unread_${code}">0</span>
          </div>
        `;
        listContainer.appendChild(item);

        if (info.photoUrl) {
          document.getElementById(`avatar_${code}`).style.backgroundImage = `url(${info.photoUrl})`;
          document.getElementById(`avatar_${code}`).innerText = '';
        } else {
          document.getElementById(`avatar_${code}`).innerText = (info.username || '?').charAt(0).toUpperCase();
        }

        // Track Real-time Presence
        db.ref('status/' + code).on('value', (s) => {
          const badge = document.getElementById(`badge_${code}`);
          const isOnline = s.val() && s.val().state === 'online';
          if (badge) badge.classList.toggle('active', isOnline);
        });

        // Track Unread Count
        const chatId = getChatId(currentUser.user_code, code);
        db.ref('messages/' + chatId).on('value', (s) => {
          const msgs = s.val() || {};
          let unread = 0;
          for (let mId in msgs) {
            if (msgs[mId].sender_code === code && msgs[mId].status !== 'seen') unread++;
          }
          const badgeEl = document.getElementById(`unread_${code}`);
          if (badgeEl) {
            badgeEl.innerText = unread;
            badgeEl.classList.toggle('active', unread > 0);
          }
        });
      });
    }

    // Inbox Listener
    function listenToFriendsAndRequests() {
      db.ref('friends').on('value', async (snapshot) => {
        const data = snapshot.val() || {};
        const friendCodes = new Set();
        const pending = [];

        for (let key in data) {
          const item = data[key];
          if (item.status === 'accepted') {
            if (item.requester_code === currentUser.user_code) friendCodes.add(item.receiver_code);
            if (item.receiver_code === currentUser.user_code) friendCodes.add(item.requester_code);
          } else if (item.status === 'pending' && item.receiver_code === currentUser.user_code) {
            pending.push({ key, requester_code: item.requester_code });
          }
        }

        document.getElementById('requestsCount').innerText = pending.length > 0 ? pending.length : '';
        document.getElementById('requestsCount').style.display = pending.length > 0 ? 'inline-block' : 'none';
        document.getElementById('requestsDot').style.display = pending.length > 0 ? 'block' : 'none';

        allFriendsData = [];
        for (let code of Array.from(friendCodes)) {
          const snap = await db.ref('users/' + code).get();
          if (snap.exists()) {
            allFriendsData.push(snap.val());
          }
        }
        
        // Render initial UI
        filterFriendsList();
      });
    }

    // =========================================
    // CHAT & BUBBLE RENDERING 
    // =========================================
    function getChatId(codeA, codeB) {
      return [String(codeA), String(codeB)].sort().join('_');
    }

    function openChat(friend) {
      activeFriend = friend;
      document.getElementById('emojiPicker').classList.remove('active');
      document.getElementById('mainMenu').style.display = 'none';
      document.getElementById('attachMenu').classList.remove('active');

      document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));
      document.getElementById('chatPanel').classList.add('active');

      document.getElementById('emptyPlaceholder').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('chatBody').style.display = 'flex';
      document.getElementById('chatInputBar').style.display = 'flex';

      document.getElementById('chatPartnerName').innerText = friend.username;
      if (friend.photoUrl) {
        document.getElementById('chatPartnerAvatar').style.backgroundImage = `url(${friend.photoUrl})`;
        document.getElementById('chatPartnerAvatar').innerText = '';
      } else {
        document.getElementById('chatPartnerAvatar').style.backgroundImage = 'none';
        document.getElementById('chatPartnerAvatar').innerText = friend.username.charAt(0).toUpperCase();
      }

      const chatBody = document.getElementById('chatBody');
      chatBody.innerHTML = '';

      if (activeChatListener) activeChatListener.off();

      const chatId = getChatId(currentUser.user_code, activeFriend.user_code);
      const chatRef = db.ref('messages/' + chatId);

      activeChatListener = chatRef;
      activeChatListener.on('child_added', (snapshot) => {
        const msg = snapshot.val();
        renderBubble(snapshot.key, msg);

        // DELIVERY STATES (If screen is open, mark seen. Otherwise mark delivered via server)
        if (String(msg.sender_code).trim() !== String(currentUser.user_code).trim()) {
          if (!msg.status || msg.status !== 'seen') {
            chatRef.child(snapshot.key).update({ status: 'seen' });
          }
          playAudioTone('receive');
        }
      });

      chatRef.on('child_changed', (snapshot) => {
        updateBubbleUI(snapshot.key, snapshot.val());
      });

      // Track Partner Presence for Delivery Status
      db.ref('status/' + activeFriend.user_code).on('value', (snap) => {
        const val = snap.val();
        const dot = document.getElementById('chatPartnerOnlineDot');
        const statusText = document.getElementById('chatPartnerStatus');
        
        if (val && val.state === 'online') {
          dot.classList.add('active');
          statusText.innerText = 'Online';
        } else {
          dot.classList.remove('active');
          if (val && val.last_seen) {
             const d = new Date(val.last_seen);
             const t = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
             statusText.innerText = `Last seen at ${t}`;
          } else {
             statusText.innerText = 'Offline';
          }
        }
      });
    }

    function closeChatMobile() {
      activeFriend = null;
      if (activeChatListener) activeChatListener.off();
      document.getElementById('chatPanel').classList.remove('active');
    }

    // Render Chat Bubbles (With File Support)
    function renderBubble(key, msg) {
      const chatBody = document.getElementById('chatBody');
      const isOutgoing = String(msg.sender_code).trim() === String(currentUser.user_code).trim();

      const row = document.createElement('div');
      row.className = `bubble-row ${isOutgoing ? 'outgoing' : 'incoming'}`;
      row.id = `row_${key}`;

      let contentHtml = '';
      
      // Parse Media types
      if (msg.image) {
        contentHtml = `<img src="${msg.image}" class="bubble-img" onclick="window.open('${msg.image}', '_blank')" alt="Image" />`;
      } 
      // Parse Document (PDF, ZIP, etc)
      else if (msg.document) {
        contentHtml = `
          <div class="file-bubble" onclick="window.open('${msg.file_url}', '_blank')">
            <span class="icon">📄</span>
            <div class="details">
              <span>${msg.file_name || 'Document'}</span>
              <small>Click to view</small>
            </div>
          </div>
        `;
      } else {
        contentHtml = String(msg.message).replace(/</g, "&lt;");
        contentHtml = contentHtml.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
      }

      // Read Receipts Logic
      let tick = '';
      if (isOutgoing) {
        const s = msg.status || 'sent';
        if (s === 'seen') {
          tick = `<span class="status-tick seen">✓✓</span>`;
        } else if (s === 'delivered') {
          tick = `<span class="status-tick delivered">✓✓</span>`;
        } else {
          tick = `<span class="status-tick sent">✓</span>`;
        }
      }

      row.innerHTML = `
        <div class="bubble ${isOutgoing ? 'outgoing' : 'incoming'}" id="bubble_${key}">
          <div id="content_${key}">${contentHtml}</div>
        </div>
        <div class="bubble-meta">
          <span>${formatTime(msg.timestamp)}</span>
          ${tick}
        </div>
      `;

      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function updateBubbleUI(key, msg) {
      const row = document.getElementById(`row_${key}`);
      if (!row) return;

      if (msg.deleted) {
        row.querySelector('.bubble').innerHTML = `<em style="color:var(--text-muted); font-size:0.8rem;">This message was deleted</em>`;
        return;
      }

      if (String(msg.sender_code).trim() === String(currentUser.user_code).trim()) {
        const tick = row.querySelector('.status-tick');
        if (tick) {
          const s = msg.status || 'sent';
          if (s === 'seen') {
            tick.className = 'status-tick seen';
            tick.innerText = '✓✓';
          } else if (s === 'delivered') {
            tick.className = 'status-tick delivered';
            tick.innerText = '✓✓';
          }
        }
      }
    }

    // Send Message
    async function handleSendMessage(event) {
      event.preventDefault();
      const input = document.getElementById('chatMessageInput');
      const text = input.value.trim();
      if (!text || !activeFriend) return;

      const chatId = getChatId(currentUser.user_code, activeFriend.user_code);
      const ts = new Date().getTime();

      input.value = '';
      document.getElementById('emojiPicker').classList.remove('active');

      playAudioTone('send');
      
      // Default to 'sent', will be updated to 'delivered' or 'seen' by recipient
      await db.ref('messages/' + chatId).push({
        sender_code: currentUser.user_code,
        message: text,
        timestamp: ts,
        status: 'sent' 
      });
    }

    // Initialize checking session
    checkSavedSession();
  </script>
